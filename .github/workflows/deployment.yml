name: Deployment

on:
  push:
    branches: [ main, dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run final tests
        run: npm test || echo "Tests failed"

      - name: Determine environment
        id: determine-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "::set-output name=environment::production"
          else
            echo "::set-output name=environment::staging"
          fi

      - name: Deploy to staging
        if: steps.determine-env.outputs.environment == 'staging'
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # For example: npm run deploy:staging
          
          # Create deployment record
          mkdir -p .github/deployments
          DEPLOY_FILE=".github/deployments/staging-$(date +"%Y-%m-%d-%H%M%S").md"
          
          echo "# Staging Deployment - $(date)" > $DEPLOY_FILE
          echo "- Branch: ${{ github.ref }}" >> $DEPLOY_FILE
          echo "- Commit: ${{ github.sha }}" >> $DEPLOY_FILE
          echo "- Triggered by: ${{ github.actor }}" >> $DEPLOY_FILE
          echo "" >> $DEPLOY_FILE
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add $DEPLOY_FILE
          git commit -m "docs(deployment): record staging deployment [skip ci]"
          git push

      - name: Deploy to production
        if: steps.determine-env.outputs.environment == 'production'
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # For example: npm run deploy:production
          
          # Create deployment record
          mkdir -p .github/deployments
          DEPLOY_FILE=".github/deployments/production-$(date +"%Y-%m-%d-%H%M%S").md"
          
          echo "# Production Deployment - $(date)" > $DEPLOY_FILE
          echo "- Branch: ${{ github.ref }}" >> $DEPLOY_FILE
          echo "- Commit: ${{ github.sha }}" >> $DEPLOY_FILE
          echo "- Triggered by: ${{ github.actor }}" >> $DEPLOY_FILE
          echo "" >> $DEPLOY_FILE
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add $DEPLOY_FILE
          git commit -m "docs(deployment): record production deployment [skip ci]"
          git push

      - name: Send deployment notification
        run: |
          echo "Sending deployment notification..."
          # Add notification commands here (e.g., Slack, email, etc.)
          # For example: curl -X POST -H 'Content-type: application/json' --data '{"text":"New deployment to ${{ steps.determine-env.outputs.environment }}"}' $SLACK_WEBHOOK_URL 